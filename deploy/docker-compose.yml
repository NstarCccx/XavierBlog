# XavierBlog 服务器编排：5 个容器 = 3 个业务镜像 + MySQL + nginx 网关
# 首次部署：cp .env.example .env 填好变量 → docker compose pull → docker compose up -d
# 日常更新：本地 ./build-push.sh → 服务器 docker compose pull && docker compose up -d
name: xavierblog

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-xavierblog}
      MYSQL_USER: ${DB_USER:-xavierblog}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 设置 DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 转义：让容器内 shell 运行时再展开 root 密码
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    # 默认不对公网暴露；需要在本机调试时再取消注释
    # ports:
    #   - "127.0.0.1:3306:3306"

  backend:
    image: ${REGISTRY:-local}/xavierblog-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: XavierBlog API
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?请在 deploy/.env 设置 SECRET_KEY}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-xavierblog}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-xavierblog}
    volumes:
      - uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${REGISTRY:-local}/xavierblog-frontend:${TAG:-latest}
    restart: unless-stopped

  admin:
    image: ${REGISTRY:-local}/xavierblog-admin:${TAG:-latest}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - admin
      - backend

  # Let's Encrypt 证书签发/续期工具，仅手动调用（profiles 隔离，不随 up -d 启动）：
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d guangxuan.xyz ...
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  mysql-data:
  uploads:
  backend-logs:
