# XavierBlog 统一入口网关（HTTPS 模式）
# 由 enable-https.sh 在证书签发成功后复制为 gateway.conf 并 reload。
# 域名变更时改两处 server_name 和两处 ssl_certificate 路径中的域名部分。

server {
    listen 80;
    server_name guangxuan.xyz www.guangxuan.xyz;

    # ACME 续期验证仍走 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name guangxuan.xyz www.guangxuan.xyz;

    ssl_certificate     /etc/letsencrypt/live/guangxuan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guangxuan.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;

    # 后端图片上传上限 10MB，网关放宽到 15MB
    client_max_body_size 15m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- 管理后台 ----------
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://admin:80;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ---------- 上传图片 ----------
    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    # ---------- 博客前台 ----------
    location / {
        proxy_pass http://frontend:80;
    }
}
