# XavierBlog 统一入口网关（HTTP 模式；启用 HTTPS 后由 gateway-ssl.conf 替换本文件）
# /         -> 博客前台（frontend 容器）
# /admin/   -> 管理后台（admin 容器，子路径原样转发）
# /api/     -> FastAPI 后端（backend 容器）
# /uploads/ -> 后端图片静态服务（数据库中存的就是这个相对路径）
server {
    listen 80;
    server_name _;

    # 后端图片上传上限 10MB，网关放宽到 15MB
    client_max_body_size 15m;

    # Let's Encrypt ACME 验证路径（certbot webroot，须在任何重定向之前）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- 管理后台 ----------
    location = /admin {
        return 301 /admin/;
    }
    # proxy_pass 不带 URI 部分：/admin/ 前缀原样转发（admin 容器按 /admin/ 托管）
    location /admin/ {
        proxy_pass http://admin:80;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ---------- 上传图片 ----------
    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    # ---------- 博客前台 ----------
    location / {
        proxy_pass http://frontend:80;
    }
}
