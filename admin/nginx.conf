# 管理后台容器：以 /admin/ 子路径提供静态 SPA，API/图片由外层网关反代到后端
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源长缓存
    location /admin/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退（产物位于 html/admin/ 下）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 直接单跑该容器时，根路径跳转到管理台
    location = / {
        return 301 /admin/;
    }
}
